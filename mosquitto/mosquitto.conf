# Minimal Mosquitto config for local/demo use.
#
# This intentionally allows anonymous connections and does not enable TLS.
# It is meant for local development and CI, NOT for exposing a broker on
# the public internet. See README.md "Limitations & production hardening
# notes" for what a production deployment would need instead
# (authentication, TLS, ACLs).

listener 1883
allow_anonymous true
persistence false
log_dest stdout
