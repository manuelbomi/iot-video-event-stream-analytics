server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built React app for everything except the API/WS paths
    # proxied below, with SPA-style fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the dashboard backend's existing REST endpoint
    # (GET /api/snapshot, defined in src/dashboard/api.py) so the frontend
    # can use plain relative URLs in both `npm run dev` (via vite.config.ts's
    # proxy) and this production nginx build.
    # "dashboard" resolves via Docker Compose service discovery to the
    # existing `dashboard` service (src/dashboard/api.py / docker-compose.yml).
    location /api/ {
        proxy_pass http://dashboard:8000/api/;
        proxy_set_header Host $host;
    }

    # Reverse-proxy the dashboard backend's existing WebSocket endpoint
    # (WS /ws, defined in src/dashboard/api.py).
    location /ws {
        proxy_pass http://dashboard:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
